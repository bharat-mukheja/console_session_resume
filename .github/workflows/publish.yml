name: Publish Marketplace preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      MARKETPLACE_BASE_IMAGES_URL: ${{ vars.MARKETPLACE_BASE_IMAGES_URL }}
      MARKETPLACE_BASE_CONTENT_URL: ${{ vars.MARKETPLACE_BASE_CONTENT_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Confirm release identity and version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./package.json'); if(p.publisher!=='bmukheja'||p.version!==process.env.REQUESTED_VERSION) process.exit(1)"
          node -e "for(const k of ['MARKETPLACE_BASE_IMAGES_URL','MARKETPLACE_BASE_CONTENT_URL']){const v=process.env[k];if(!v||!v.startsWith('https://')||!v.endsWith('/')){console.error('Set public HTTPS listing root: '+k);process.exit(1)}}"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
      - run: npm run verify:package -- --check-links
      - name: Publish using Marketplace Trusted Publishing
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: npx --no-install vsce publish --oidc --pre-release --packagePath "dist/console-session-resume-${REQUESTED_VERSION}.vsix"
